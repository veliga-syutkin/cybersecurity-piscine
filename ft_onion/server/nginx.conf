# nginx configuration of the ft_onion server. It replaces the whole
# /etc/nginx/nginx.conf: nothing from Debian's sites-enabled/ or conf.d/ is
# loaded, so this file is the complete configuration.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

# Errors go to the container logs (docker logs).
error_log /dev/stderr warn;

events {
	worker_connections 512;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	# No access log: the IP is always 127.0.0.1 (tor), but a timestamped list
	# of visits could still help a traffic correlation attack if the server
	# were seized or compromised. Keep nothing about visitors.
	access_log off;
	sendfile on;

	# Do not print the nginx version in error pages and headers.
	server_tokens off;

	server {
		# Loopback only: the page is reachable through tor (HiddenServicePort
		# 80 in torrc), never through the container's network interface.
		listen 127.0.0.1:80;
		server_name _;

		root /var/www/ft_onion;
		index index.html;

		# Security headers, sent on every response (always), errors included.
		# The content security policy forbids everything except the one
		# inline <script> of index.html, allowed by its sha256 hash (no
		# 'unsafe-inline'). The page has no CSS, image, form or external
		# resource. csp_check.sh fails the image build if this hash no longer
		# matches the script.
		add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-YhKyVj4JrjMPJG1T31HrGC2HBuZJ4iq7COeiQDpatWM='; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

		location / {
			try_files $uri $uri/ =404;
		}
	}
}
